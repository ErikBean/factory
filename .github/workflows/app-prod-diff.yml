name: App production diff

# Called by a factory-built app's CI on each pull request. Shows how the pull
# request changes production, by comparing its prod stage with the templates
# the last production deploy saved. It runs the pull request's code, so it gets
# no AWS credentials. The caller grants actions: read, to find the last deploy.
#
#   jobs:
#     prod-diff:
#       permissions:
#         contents: read
#         actions: read
#       uses: ErikBean/factory/.github/workflows/app-prod-diff.yml@<sha> # vX.Y.Z
on:
  workflow_call:
    inputs:
      deploy-workflow:
        description: The app's workflow file that deploys to production and saves prod-templates.
        type: string
        default: deploy.yml

permissions:
  contents: read
  actions: read

jobs:
  prod-diff:
    name: prod-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx cdk synth --quiet -c stage=prod -o cdk.out.prod
      - name: Download the last production templates
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy-workflow }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # Only two cases count as nothing to compare with: the deploy workflow
        # isn't on the default branch yet, so nothing has deployed, or the last
        # deploy's templates have expired. Any other error fails the step, so
        # the diff never passes on a deploy it couldn't read.
        run: |
          set -euo pipefail
          if ! run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$DEPLOY_WORKFLOW" \
            --branch "$DEFAULT_BRANCH" \
            --status success --limit 1 --json databaseId -q '.[0].databaseId' 2>err.txt)"; then
            cat err.txt >&2
            if grep -q "HTTP 404: workflow $DEPLOY_WORKFLOW not found on the default branch" err.txt; then
              echo "$DEPLOY_WORKFLOW isn't on the default branch yet, so nothing is deployed." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit 1
          fi
          if [ -z "$run_id" ]; then
            echo "$DEPLOY_WORKFLOW has no successful run yet, so nothing is deployed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          expired="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
            -q '[.artifacts[] | select(.name == "prod-templates")][0] | if . == null then "missing" else (.expired | tostring) end')"
          case "$expired" in
            false) gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n prod-templates -D prod-before ;;
            true) echo "The templates from the last deploy, run $run_id, have expired." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *) echo "Deploy run $run_id saved no prod-templates artifact." >&2; exit 1 ;;
          esac
      - run: npx --no-install factory-prod-diff prod-before cdk.out.prod | tee -a "$GITHUB_STEP_SUMMARY"
