name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # No real account IDs, emails or keys in tracked files (AGENTS.md).
      - run: python3 scripts/check-private.py
      - run: npx --no-install openspec validate --specs --no-interactive
      # The skills' tests, and shellcheck, cfn-lint and actionlint over the
      # repo-setup templates and this repo's workflows, at the versions
      # skills/tests/requirements.txt pins.
      - name: Install the skills' linters
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r skills/tests/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: skills/check.sh
      - run: npm pack --dry-run --workspace cdk
