name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its base, for the change-note check.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Every pull request adds a change note (.changeset/README.md).
      - if: github.event_name == 'pull_request'
        run: node scripts/check-changeset.mjs
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      - run: scripts/test-check-changeset.sh
      - run: npm test
      # No real account IDs, emails or keys in tracked files (AGENTS.md).
      - run: python3 scripts/check-private.py
      - run: npx --no-install openspec validate --specs --no-interactive
      # The skills' tests, and shellcheck, cfn-lint and actionlint over the
      # repo-setup templates and this repo's workflows, at the versions
      # skills/tests/requirements.txt pins.
      # actionlint-py has no prebuilt packages, so pip builds it from source,
      # and the build downloads actionlint from GitHub anonymously, which
      # GitHub sometimes refuses. The pip cache keeps the package pip builds,
      # so the download only happens when requirements.txt changes or the
      # cache expires. A pinned Python keeps a runner image update from
      # emptying the cache, and the retries cover a failed download.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: skills/tests/requirements.txt
      - name: Install the skills' linters
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          for attempt in 1 2 3; do
            "$RUNNER_TEMP/venv/bin/pip" install --quiet -r skills/tests/requirements.txt && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::Installing the linters failed; retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: skills/check.sh
      - run: npm pack --dry-run --workspace cdk
      # A new app made from template/ installs, tests and synthesizes.
      - run: scripts/test-create-app.sh
