name: Deploy

# Every push to main deploys to production, after the tests pass.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: {{factory}}/.github/workflows/app-ci.yml@{{release}}
  deploy:
    needs: test
    permissions:
      contents: read
      id-token: write
    uses: {{factory}}/.github/workflows/app-deploy.yml@{{release}}
    with:
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      aws-region: ${{ vars.AWS_REGION }}
